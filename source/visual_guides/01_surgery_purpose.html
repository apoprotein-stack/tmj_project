<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顳顎關節內視鏡手術｜手術目的</title>
<style>
  :root{--ink:#183f4a;--muted:#557078;--accent:#a56636;--cream:#f7f6ef;--line:#d9ddd7;--teal:#dfeceb;--white:#fffefa}
  *{box-sizing:border-box}
  body{margin:0;background:#e9ece8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
  main{width:1600px;min-height:900px;margin:0 auto;padding:68px 86px 50px;background:var(--cream);position:relative;overflow:hidden}
  main:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#aab6ae 1.1px,transparent 1.1px);background-size:76px 76px;opacity:.42;pointer-events:none}
  .content{position:relative;z-index:1}
  .eyebrow{font-size:21px;letter-spacing:.12em;color:var(--muted);margin-bottom:23px}
  h1{font-size:58px;line-height:1.08;letter-spacing:.06em;margin:0 0 12px;font-weight:800}
  .subtitle{font-size:30px;color:var(--muted);letter-spacing:.06em;margin-bottom:45px}
  .layout{display:grid;grid-template-columns:1fr 460px 1fr;gap:34px;align-items:center}
  .col{display:flex;flex-direction:column;gap:26px}
  .card{background:rgba(255,254,250,.94);border:1px solid var(--line);border-radius:20px;padding:26px 28px 25px;box-shadow:0 7px 22px rgba(24,63,74,.06);min-height:176px}
  .num{font-size:23px;color:var(--accent);font-weight:800;letter-spacing:.04em;display:inline-block;margin-right:12px;vertical-align:top}
  .card h2{display:inline;font-size:28px;letter-spacing:.03em;margin:0;line-height:1.25}
  .card p{font-size:23px;line-height:1.58;color:var(--muted);margin:17px 0 0;letter-spacing:.025em}
  .visual{height:520px;border-radius:28px;background:linear-gradient(150deg,#e6f0ee,#f8f8f1 70%);border:1px solid #cfddd9;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 10px rgba(255,255,255,.24)}
  .visual-label{font-size:24px;letter-spacing:.08em;color:var(--muted);margin-bottom:22px}
  .jaw{width:310px;height:230px;position:relative}
  .skull{position:absolute;left:25px;top:17px;width:260px;height:118px;border:17px solid var(--ink);border-bottom:0;border-radius:150px 150px 0 0;transform:rotate(-4deg);background:rgba(255,255,255,.3)}
  .condyle{position:absolute;left:86px;top:104px;width:76px;height:76px;border:14px solid var(--accent);border-radius:50%;background:#fff5e9;z-index:3}
  .disc{position:absolute;left:82px;top:91px;width:114px;height:29px;background:#e9b276;border-radius:50%;transform:rotate(-12deg);z-index:2;opacity:.9}
  .mandible{position:absolute;left:56px;top:145px;width:205px;height:80px;border:17px solid var(--ink);border-top:0;border-radius:0 0 115px 115px;transform:rotate(4deg);background:rgba(255,255,255,.25)}
  .scope{position:absolute;right:8px;top:118px;width:126px;height:9px;background:var(--accent);transform:rotate(-33deg);border-radius:12px;z-index:4}
  .scope:before{content:"";position:absolute;left:-19px;top:-5px;width:26px;height:19px;background:#e7b36e;border-radius:50%}
  .scope:after{content:"";position:absolute;right:-9px;top:-3px;width:15px;height:15px;border-radius:50%;background:var(--ink)}
  .wash{position:absolute;left:57px;top:192px;width:78px;height:52px;border-left:4px solid #4f9a9a;border-bottom:4px solid #4f9a9a;border-radius:0 0 0 45px;transform:rotate(-25deg);opacity:.8}
  .wash:after{content:"";position:absolute;left:-11px;bottom:-13px;width:13px;height:13px;border-radius:50%;background:#4f9a9a;box-shadow:20px 9px 0 -2px #70b5b0,38px -1px 0 -4px #70b5b0}
  .visual-note{font-size:17px;line-height:1.35;color:var(--muted);margin-top:12px;letter-spacing:.025em;text-align:center;max-width:410px}
  .realistic{width:350px;height:350px;object-fit:cover;object-position:center;border-radius:12px;display:block;box-shadow:0 4px 14px rgba(24,63,74,.12)}
  .anatomy{width:350px;height:250px;position:relative;color:var(--ink)}
  .anatomy .orientation{position:absolute;top:-12px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:15px;color:var(--muted);letter-spacing:.1em}
  .temporal{position:absolute;left:43px;top:39px;width:250px;height:87px;border:15px solid var(--ink);border-bottom:0;border-radius:150px 100px 0 0;transform:skewX(-10deg);background:#edf4f0}
  .eminence{position:absolute;left:61px;top:103px;width:84px;height:43px;border-left:14px solid var(--ink);border-bottom:14px solid var(--ink);border-radius:0 0 0 52px;transform:rotate(13deg);background:#edf4f0;z-index:2}
  .condyle2{position:absolute;left:128px;top:145px;width:122px;height:82px;border:15px solid var(--accent);border-radius:55% 55% 45% 45%;background:#fff3e5;z-index:3;transform:rotate(-5deg)}
  .disc2{position:absolute;left:119px;top:126px;width:145px;height:31px;background:#e6af70;border-radius:50%;transform:rotate(-10deg);z-index:4;box-shadow:0 0 0 3px rgba(165,102,54,.08)}
  .space{position:absolute;left:137px;top:107px;width:115px;height:31px;border-top:5px solid #68a9a6;border-radius:50%;z-index:5}
  .capsule{position:absolute;left:104px;top:97px;width:175px;height:139px;border:3px dashed #7aa9a2;border-radius:48% 48% 45% 45%;z-index:1;transform:rotate(-3deg)}
  .scope2{position:absolute;left:267px;top:166px;width:94px;height:8px;background:var(--accent);border-radius:10px;transform:rotate(-19deg);z-index:7}
  .scope2:before{content:"";position:absolute;left:-13px;top:-5px;width:22px;height:18px;background:#e7b36e;border-radius:50%}
  .scope2:after{content:"";position:absolute;right:-7px;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--ink)}
  .label{position:absolute;font-size:15px;color:var(--muted);background:rgba(255,254,250,.85);padding:2px 5px;border-radius:5px;z-index:8;white-space:nowrap}
  .label.temporal-l{left:5px;top:45px}.label.disc-l{left:7px;top:121px}.label.condyle-l{left:256px;top:215px}.label.scope-l{left:245px;top:181px}
  .bottom{margin-top:35px;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:18px;letter-spacing:.04em}
  .key{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<main><div class="content">
  <div class="eyebrow">顳顎關節內視鏡手術｜手術衛教</div>
  <h1>手術目的</h1>
  <div class="subtitle">減輕關節內疼痛，改善下顎活動</div>
  <section class="layout" aria-label="四項手術目的">
    <div class="col">
      <article class="card"><span class="num">01</span><h2>減少發炎</h2><p>沖洗與處理滑膜炎，減少關節內刺激。</p></article>
      <article class="card"><span class="num">02</span><h2>解除機械限制</h2><p>鬆解沾黏，改善卡住與滑動受限。</p></article>
    </div>
    <div class="visual" aria-label="顳顎關節與內視鏡示意">
      <div class="visual-label">顳顎關節寫實剖面示意</div>
      <img class="realistic" src="/home/ubuntu/tmj_realistic_anatomy.png" alt="顳顎關節寫實剖面與內視鏡進入關節腔示意圖">
      <div class="visual-note">內視鏡由耳前側（側方）進入關節腔，檢查並處理病灶</div>
    </div>
    <div class="col">
      <article class="card"><span class="num">03</span><h2>保留可用組織</h2><p>依病灶選擇盤復位、固定或修補。</p></article>
      <article class="card"><span class="num">04</span><h2>評估療效</h2><p>以疼痛、張口與進食功能追蹤，不以聲音消失作唯一指標。</p></article>
    </div>
  </section>
  <div class="bottom"><span><span class="key">重點：</span>改善疼痛與功能，同時盡量保留可用組織</span><span>示意圖｜實際術式依醫師評估</span></div>
</div></main>
</body>
</html>
